name: Build and publish Python package

on:
  push:
    branches:
      - master
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version="$(python setup.py --version)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "Tag version $tag_version does not match package version $package_version"
            exit 1
          fi

      - name: Build source and wheel distributions
        run: python -m build --sdist --wheel --outdir dist/ .

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Verify HTML template is packaged
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one wheel, found {len(wheels)}")

          with ZipFile(wheels[0]) as wheel:
              files = set(wheel.namelist())
          expected = "nonebot-plugin-random/templates/pool_manager.html"
          if expected not in files:
              raise SystemExit(f"Missing packaged template: {expected}")

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nonebot-plugin-random
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
